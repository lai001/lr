[package]
name = "rs_proc_macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }
quote = "1.0.47"
prettyplease = "0.3.0"
dunce = "1.0.5"
path-slash = "0.2.1"
naga = { version = "29.0.4" }
wgpu = "29.0.4"
anyhow = { version = "1.0.104" }
toml_edit = "0.25.13"
rs_foundation = { path = "../rs_foundation" }
